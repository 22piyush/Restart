<div class="container">
    <h1>Employee CRUD</h1>
    <button (click)="fetchEmployee()" class="btn btn-primary mb-3">Fetch Employee</button>

    <div class="d-flex flex-column flex-lg-row gap-4">

        <!-- Add Employee Form -->
        <div class="w-100 w-lg-50">
            <h3>Add Employee</h3>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input #name type="text" class="form-control" placeholder="Enter name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input #email type="email" class="form-control" placeholder="Enter email">
            </div>

            <button type="submit" class="btn btn-primary" (click)="addEmployee(name.value, email.value)">
                Add Employee
            </button>
        </div>

        <!-- Employee Table -->
        <div class="w-100 w-lg-50">
            <h3>Employees</h3>

            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let employee of employees$ | async">
                            <td>{{ employee.id }}</td>
                            <td>{{ employee.name }}</td>
                            <td>{{ employee.email }}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" (click)="deleteEmployee(employee.id)">
                                    Delete
                                </button>
                            </td>
                            <button class="btn btn-warning btn-sm me-2" (click)="editEmployee(employee.id, employee.name, employee.email)">
                                Edit
                            </button>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>
